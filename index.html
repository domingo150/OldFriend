<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>老友默契與吐槽大會</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body, html { height: 100%; width: 100%; background: #121214; color: #fff; -webkit-user-select: none; overflow-x: hidden; }
        .screen { display: none; min-height: 100%; width: 100%; flex-direction: column; justify-content: center; align-items: center; padding: 20px; }
        .active { display: flex !important; }
        
        .card { background: #202024; padding: 25px; border-radius: 14px; width: 100%; max-width: 480px; text-align: center; box-shadow: 0 8px 24px rgba(0,0,0,0.4); margin-bottom: 15px; }
        h2 { color: #ffd166; margin-bottom: 10px; }
        p { color: #c4c4cc; line-height: 1.5; }
        
        input, textarea { width: 100%; padding: 14px; margin: 15px 0; border: 2px solid #323238; background: #121214; color: #fff; border-radius: 8px; font-size: 16px; outline: none; }
        input:focus, textarea:focus { border-color: #00b0ff; }
        textarea { resize: none; height: 100px; text-align: left; }
        
        button { width: 100%; padding: 14px; background: #00b0ff; color: #fff; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; margin-top: 8px; }
        button:hover { background: #0091ea; }
        button:disabled { background: #4c4c52; cursor: not-allowed; color: #8e8e93; }

        /* 題目展示框 */
        .prompt-box { background: linear-gradient(135deg, #2b2d42, #1d1e2c); border-left: 5px solid #ffd166; padding: 20px; border-radius: 10px; margin: 15px 0; font-size: 20px; font-weight: bold; line-height: 1.5; text-align: left; }
        .highlight-name { color: #ff4757; background: rgba(255, 71, 87, 0.15); padding: 2px 8px; border-radius: 6px; }

        /* 投票選項卡片 */
        .vote-card { background: #2a2a30; border: 2px solid #3a3a42; padding: 16px; border-radius: 10px; margin: 10px 0; text-align: left; cursor: pointer; transition: 0.2s; position: relative; }
        .vote-card:hover { border-color: #06d6a0; transform: translateY(-2px); }
        .vote-card.selected { border-color: #06d6a0; background: rgba(6, 214, 160, 0.15); }
        .vote-card.my-own { border-color: #555; opacity: 0.6; cursor: not-allowed; }
        .vote-text { font-size: 18px; font-weight: 500; color: #fff; word-break: break-word; }
        .vote-author { font-size: 13px; color: #ffd166; margin-top: 8px; font-weight: bold; }

        /* 排行榜 */
        .rank-list { width: 100%; max-width: 480px; background: #202024; border-radius: 12px; padding: 15px; max-height: 50vh; overflow-y: auto; margin: 15px 0; }
        .rank-item { display: flex; justify-content: space-between; padding: 12px; border-bottom: 1px solid #323238; font-size: 17px; }
        .rank-item:first-child { color: #ffd166; font-weight: bold; font-size: 19px; }

        /* 關主專屬控制面板 */
        .host-panel { background: #2b1d1d; border: 1px solid #ff5722; padding: 15px; border-radius: 12px; width: 100%; max-width: 480px; margin-top: 15px; }
        .host-title { font-size: 13px; color: #ff8a65; font-weight: bold; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
        .btn-host { background: #ff5722; }
        .btn-host:hover { background: #e64a19; }
        .btn-reset { background: #dc3545; }
        .btn-reset:hover { background: #c82333; }
        
        .badge { display: inline-block; background: #323238; padding: 4px 10px; border-radius: 20px; font-size: 14px; color: #06d6a0; margin-top: 10px; }
        .player-tags { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 15px; }
        .player-tag { background: #323238; padding: 6px 12px; border-radius: 16px; font-size: 14px; }
    </style>
</head>
<body>

    <!-- 1. 登入畫面 -->
    <div id="login-screen" class="screen active">
        <div class="card">
            <h2>🔥 老友默契與吐槽大會</h2>
            <p>輸入你的江湖稱號（最多 20 人）</p>
            <input type="text" id="username-input" placeholder="你的名字 (關主請輸入 boss)" maxlength="10" style="text-align: center;">
            <button id="join-btn" onclick="joinRoom()">進入大廳</button>
        </div>
    </div>

    <!-- 2. 大廳等待畫面 -->
    <div id="lobby-screen" class="screen">
        <div class="card">
            <h2>🎮 準備大廳</h2>
            <p>目前在線人數：<strong id="lobby-count" style="color:#ffd166; font-size: 22px;">0</strong> / 20 人</p>
            <div class="player-tags" id="lobby-player-list"></div>
            <p style="margin-top: 20px; font-size: 14px; color: #8e8e93;" id="lobby-hint">等待關主開啟第一回合...</p>
        </div>

        <!-- 關主控場 -->
        <div class="host-panel" id="host-lobby-panel" style="display:none;">
            <div class="host-title">👑 關主控制台</div>
            <button class="btn-host" onclick="hostStartNewRound(0)">開始第 1 題（自動隨機抽人名）</button>
            <button class="btn-reset" onclick="hostResetGame()">強制重置房間並踢出所有玩家</button>
        </div>
    </div>

    <!-- 3. 填寫吐槽答案畫面 -->
    <div id="writing-screen" class="screen">
        <div class="card">
            <div style="display:flex; justify-content:space-between; color:#8e8e93; font-size:14px;">
                <span>第 <strong id="write-round-num" style="color:#fff;">1</strong> 題</span>
                <span>我的積分: <strong id="my-score-write" style="color:#ffd166;">0</strong></span>
            </div>
            
            <div class="prompt-box" id="write-prompt-text">載入題目中...</div>
            
            <textarea id="answer-input" placeholder="寫下你覺得最神、最爆笑、或最符合他本人的答案..." maxlength="60"></textarea>
            <button id="submit-ans-btn" style="background:#06d6a0;" onclick="submitAnswer()">送出神回覆！</button>
            
            <div class="badge">已交卷人數：<span id="ans-progress">0 / 0</span></div>
        </div>

        <!-- 關主控場 -->
        <div class="host-panel" id="host-write-panel" style="display:none;">
            <div class="host-title">👑 關主控制台</div>
            <button class="btn-host" onclick="hostMoveToVoting()">截止作答 ➔ 進入全體投票環節</button>
            <button class="btn-reset" onclick="hostResetGame()">重置整輪遊戲</button>
        </div>
    </div>

    <!-- 4. 匿名投票環節畫面 -->
    <div id="voting-screen" class="screen">
        <div class="card" style="max-width: 550px;">
            <h3 style="color:#06d6a0; margin-bottom: 5px;">🗳️ 選出最神回覆！</h3>
            <p style="font-size: 13px; margin-bottom: 10px;">（不能投給自己，每人一票）</p>
            
            <div class="prompt-box" id="vote-prompt-text" style="font-size: 16px; padding: 12px;"></div>
            
            <div id="vote-options-container"></div>
            
            <div class="badge">已投票人數：<span id="vote-progress">0 / 0</span></div>
        </div>

        <!-- 關主控場 -->
        <div class="host-panel" id="host-vote-panel" style="display:none; max-width: 550px;">
            <div class="host-title">👑 關主控制台</div>
            <button class="btn-host" onclick="hostRevealAndRank()">截止投票 ➔ 揭曉作者與本輪排行</button>
            <button class="btn-reset" onclick="hostResetGame()">重置整輪遊戲</button>
        </div>
    </div>

    <!-- 5. 揭曉作者與積分排行榜 -->
    <div id="ranking-screen" class="screen">
        <div class="card" style="max-width: 550px;">
            <h2 id="rank-header-title">🏆 本輪揭曉與總積分榜</h2>
            <p style="font-size: 14px; margin-bottom: 10px;">每獲得 1 票可得 <strong>1000 分</strong>！</p>
            
            <!-- 本輪答案作者揭曉區 -->
            <div id="round-results-container" style="text-align: left; margin-bottom: 20px;"></div>
            
            <h3 style="color:#ffd166; text-align:left; font-size:16px; margin-bottom:8px;">📊 目前總積分排行</h3>
            <div class="rank-list" id="leaderboard-container" style="margin: 0; max-height: 30vh;"></div>
        </div>

        <!-- 關主控場 -->
        <div class="host-panel" id="host-rank-panel" style="display:none; max-width: 550px;">
            <div class="host-title">👑 關主控制台</div>
            <button id="next-round-btn" class="btn-host" onclick="hostNextRound()">進入下一題 ➔</button>
            <button class="btn-reset" onclick="hostResetGame()">結束並重新開始整輪遊戲</button>
        </div>
    </div>

    <!-- 引入 Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

    <script>
        // ==========================================
        // 🛠️ CONFIG 區塊：請貼上你的 Firebase 設定
        // ==========================================
	const firebaseConfig = {
	  apiKey: "AIzaSyCLVPqDnLhjF_pj0sISOR73YFciNyeAd4I",
	  authDomain: "my-map-game-fd694.firebaseapp.com",
	  databaseURL: "https://my-map-game-fd694-default-rtdb.asia-southeast1.firebasedatabase.app",
	  projectId: "my-map-game-fd694",
 	 storageBucket: "my-map-game-fd694.firebasestorage.app",
 	 messagingSenderId: "749340315291",
	  appId: "1:749340315291:web:f6486949cbef4d5287403e",
	  measurementId: "G-WFZ8HPJJ2H"
	};
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // 遊戲參數設定
        const HOST_PASSWORD = "boss";
        const MAX_PLAYERS = 20;

        // ==========================================
        // 📝 默契與吐槽題庫（{NAME} 會自動替換成在場玩家名字）
        // 你可以隨時在這裡自由增減或修改題目！
        // ==========================================
        const promptTemplates = [
            "如果 {NAME} 突然中了樂透頭獎，他第一件做的蠢事會是什麼？",
            "在世界末日來臨時，{NAME} 背包裡唯一堅持要帶上的廢物是＿＿＿？",
	    "{NAME} 這輩子絕對不可能改掉的壞習慣是＿＿＿？",
            "如果讓 {NAME} 當選總統，他頒布的第一條法令會是＿＿＿？",
	    "{NAME} 喝醉之後最可怕的隱藏技能是＿＿＿？",
	    "十年後的某天，我們在新聞上看到 {NAME}，標題一定會寫：『驚！某市民竟然＿＿＿』？"
	    "如果 {NAME} 被抓進警察局，最有可能的罪名是___?",
	    "如果 {NAME} 轉行去當 YouTuber，他的頻道主打內容會是＿＿＿？",
            "如果幫 {NAME} 的人生拍一部電影，片名應該叫做《＿＿＿》？",
            "大家表面上不說，但其實心裡都知道 {NAME} 最大的弱點是＿＿＿？",
        ];

        // 本地狀態變數
        let myName = "";
        let isHost = false;
        let currentRound = 0;
        let hasSubmitted = false;
        let myVotedTarget = null;
        let usedTargetNames = []; // 關主用來記錄已經被當過主角的人，盡量不重複

        // --- 1. 加入房間與防呆檢查 ---
        function joinRoom() {
            const input = document.getElementById('username-input').value.trim();
            if (!input) return alert("請輸入你的名字！");
            
            // 禁止特殊符號以免 Firebase 路徑報錯
            if (/[.#$\[\]]/.test(input)) return alert("名字請勿包含 . # $ [ ] 等特殊符號！");

            myName = input;
            document.getElementById('join-btn').disabled = true;

            db.ref('roast_game/players').once('value', snapshot => {
                const players = snapshot.val() || {};
                const playerCount = Object.keys(players).length;

                // 檢查 20 人上限（如果是已存在的玩家斷線重連則放行）
                if (playerCount >= MAX_PLAYERS && !players[myName] && myName.toLowerCase() !== HOST_PASSWORD) {
                    alert(`抱歉，房間已達 ${MAX_PLAYERS} 人上限！`);
                    document.getElementById('join-btn').disabled = false;
                    return;
                }

                // 判定關主身分
                if (myName.toLowerCase() === HOST_PASSWORD.toLowerCase()) {
                    isHost = true;
                    document.getElementById('host-lobby-panel').style.display = 'block';
                    document.getElementById('host-write-panel').style.display = 'block';
                    document.getElementById('host-vote-panel').style.display = 'block';
                    document.getElementById('host-rank-panel').style.display = 'block';
                    document.getElementById('lobby-hint').innerText = "👑 您已登入為關主，請確認人數到齊後按下開始。";
                }

                // 寫入或保留玩家分數（支援中途加入或斷線重連）
                if (!players[myName]) {
                    db.ref(`roast_game/players/${myName}`).set({ score: 0 });
                }

                // 若房間尚未初始化狀態，建立大廳狀態
                db.ref('roast_game/state').once('value', stateSnap => {
                    if (!stateSnap.exists()) {
                        db.ref('roast_game/state').set({ status: "lobby", round: 0, prompt: "" });
                    }
                });

                startListeners();
            });
        }

        // --- 2. 啟動即時同步監聽器 ---
        function startListeners() {
            // 監聽玩家清單與是否被踢出
            db.ref('roast_game/players').on('value', snapshot => {
                const players = snapshot.val() || {};
                const names = Object.keys(players);

                // 被關主重置踢出判定
                if (!isHost && !players[myName]) {
                    db.ref('roast_game/players').off();
                    db.ref('roast_game/state').off();
                    db.ref('roast_game/answers').off();
                    db.ref('roast_game/votes').off();
                    
                    alert("遊戲已由關主重置，請重新輸入暱稱加入！");
                    document.getElementById('join-btn').disabled = false;
                    switchScreen('login-screen');
                    return;
                }

                // 更新大廳人數與名單標籤
                document.getElementById('lobby-count').innerText = names.length;
                const listContainer = document.getElementById('lobby-player-list');
                listContainer.innerHTML = names.map(n => 
                    `<span class="player-tag">${n.toLowerCase() === HOST_PASSWORD ? '👑 ' + n : n}</span>`
                ).join('');

                // 更新自己的右上角分數
                if (players[myName]) {
                    document.getElementById('my-score-write').innerText = players[myName].score || 0;
                }
            });

            // 監聽遊戲階段切換（支援中途加入直接切入當前畫面）
            db.ref('roast_game/state').on('value', snapshot => {
                const state = snapshot.val();
                if (!state) return;
                currentRound = state.round;

                if (state.status === "lobby") {
                    switchScreen('lobby-screen');
                } else if (state.status === "writing") {
                    renderWritingScreen(state);
                } else if (state.status === "voting") {
                    renderVotingScreen(state);
                } else if (state.status === "ranking") {
                    renderRankingScreen(state);
                }
            });

            // 監聽作答進度
            db.ref('roast_game/answers').on('value', snapshot => {
                const answers = snapshot.val() || {};
                db.ref('roast_game/players').once('value', pSnap => {
                    const totalPlayers = Object.keys(pSnap.val() || {}).length;
                    document.getElementById('ans-progress').innerText = `${Object.keys(answers).length} / ${totalPlayers}`;
                });
            });

            // 監聽投票進度
            db.ref('roast_game/votes').on('value', snapshot => {
                const votes = snapshot.val() || {};
                db.ref('roast_game/players').once('value', pSnap => {
                    const totalPlayers = Object.keys(pSnap.val() || {}).length;
                    document.getElementById('vote-progress').innerText = `${Object.keys(votes).length} / ${totalPlayers}`;
                });
            });
        }

        function switchScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        // --- 3. 階段一：填寫吐槽答案 ---
        function renderWritingScreen(state) {
            switchScreen('writing-screen');
            document.getElementById('write-round-num').innerText = `${state.round + 1} / ${promptTemplates.length}`;
            document.getElementById('write-prompt-text').innerHTML = state.promptHTML;

            // 檢查自己這回合是否已經交過卷（防止重整重複交卷）
            db.ref(`roast_game/answers/${myName}`).once('value', snapshot => {
                if (snapshot.exists()) {
                    hasSubmitted = true;
                    document.getElementById('answer-input').value = snapshot.val().text;
                    document.getElementById('answer-input').disabled = true;
                    document.getElementById('submit-ans-btn').disabled = true;
                    document.getElementById('submit-ans-btn').innerText = "已送出！等待其他人寫完...";
                } else {
                    hasSubmitted = false;
                    document.getElementById('answer-input').value = "";
                    document.getElementById('answer-input').disabled = false;
                    document.getElementById('submit-ans-btn').disabled = false;
                    document.getElementById('submit-ans-btn').innerText = "送出神回覆！";
                }
            });
        }

        function submitAnswer() {
            const text = document.getElementById('answer-input').value.trim();
            if (!text) return alert("不要交白卷啦！隨便寫個梗吧！");

            hasSubmitted = true;
            document.getElementById('answer-input').disabled = true;
            document.getElementById('submit-ans-btn').disabled = true;
            document.getElementById('submit-ans-btn').innerText = "已送出！等待其他人寫完...";

            db.ref(`roast_game/answers/${myName}`).set({
                author: myName,
                text: text
            });
        }

        // --- 4. 階段二：匿名投票 ---
        function renderVotingScreen(state) {
            switchScreen('voting-screen');
            document.getElementById('vote-prompt-text').innerHTML = state.promptHTML;

            Promise.all([
                db.ref('roast_game/answers').once('value'),
                db.ref(`roast_game/votes/${myName}`).once('value')
            ]).then(([ansSnap, myVoteSnap]) => {
                const answers = ansSnap.val() || {};
                myVotedTarget = myVoteSnap.val();
                
                const container = document.getElementById('vote-options-container');
                container.innerHTML = "";

                const authors = Object.keys(answers);
                if (authors.length === 0) {
                    container.innerHTML = "<p>這回合居然沒有人交卷！請關主直接進入下一題。</p>";
                    return;
                }

                // 將答案隨機打亂順序，避免總是照進房順序排
                authors.sort(() => Math.random() - 0.5);

                authors.forEach(author => {
                    const isMine = (author === myName);
                    const isSelected = (myVotedTarget === author);
                    
                    const card = document.createElement('div');
                    card.className = `vote-card ${isMine ? 'my-own' : ''} ${isSelected ? 'selected' : ''}`;
                    card.innerHTML = `
                        <div class="vote-text">「${escapeHTML(answers[author].text)}」</div>
                        ${isMine ? '<div style="font-size:12px; color:#8e8e93; margin-top:5px;">（這是你自己的答案，不能投）</div>' : ''}
                    `;

                    if (!isMine) {
                        card.onclick = () => castVote(author);
                    }
                    container.appendChild(card);
                });
            });
        }

        function castVote(targetAuthor) {
            myVotedTarget = targetAuthor;
            db.ref(`roast_game/votes/${myName}`).set(targetAuthor);
            
            // 即時更新 UI 選取框
            document.querySelectorAll('.vote-card').forEach(c => c.classList.remove('selected'));
            event.currentTarget.classList.add('selected');
        }

        // --- 5. 階段三：揭曉作者與總積分榜 ---
        function renderRankingScreen(state) {
            switchScreen('ranking-screen');
            
            if (state.round + 1 >= promptTemplates.length) {
                document.getElementById('rank-header-title').innerText = "🎉 最終大結局總積分榜 🎉";
                if (isHost) document.getElementById('next-round-btn').style.display = 'none';
            } else {
                document.getElementById('rank-header-title').innerText = `第 ${state.round + 1} 題 揭曉與排行`;
                if (isHost) document.getElementById('next-round-btn').style.display = 'block';
            }

            Promise.all([
                db.ref('roast_game/answers').once('value'),
                db.ref('roast_game/votes').once('value'),
                db.ref('roast_game/players').once('value')
            ]).then(([ansSnap, voteSnap, playerSnap]) => {
                const answers = ansSnap.val() || {};
                const votes = voteSnap.val() || {};
                const players = playerSnap.val() || {};

                // 統計本輪每個人獲得幾票
                const voteCounts = {};
                Object.values(votes).forEach(target => {
                    voteCounts[target] = (voteCounts[target] || 0) + 1;
                });

                // 渲染本輪答案與作者揭曉
                const resContainer = document.getElementById('round-results-container');
                resContainer.innerHTML = "";
                
                const sortedAuthors = Object.keys(answers).sort((a, b) => (voteCounts[b] || 0) - (voteCounts[a] || 0));
                sortedAuthors.forEach(author => {
                    const count = voteCounts[author] || 0;
                    resContainer.innerHTML += `
                        <div class="vote-card" style="cursor:default; margin: 8px 0; padding: 12px;">
                            <div class="vote-text" style="font-size:16px;">「${escapeHTML(answers[author].text)}」</div>
                            <div class="vote-author">✍️ 作者：${author} ｜ 獲得 ${count} 票 (+${count * 1000}分)</div>
                        </div>
                    `;
                });

                // 渲染總積分排行榜
                const lbContainer = document.getElementById('leaderboard-container');
                lbContainer.innerHTML = "";
                const sortedPlayers = Object.keys(players)
                    .map(name => ({ name, score: players[name].score || 0 }))
                    .sort((a, b) => b.score - a.score);

                sortedPlayers.forEach((p, idx) => {
                    lbContainer.innerHTML += `
                        <div class="rank-item">
                            <span>#${idx + 1} ${p.name}</span>
                            <span>${p.score} 分</span>
                        </div>
                    `;
                });
            });
        }

        // ==========================================
        // 👑 關主控場核心指令
        // ==========================================
        function hostStartNewRound(roundIdx) {
            if (!isHost) return;

            // 清空上一輪的答案與投票紀錄
            Promise.all([
                db.ref('roast_game/answers').remove(),
                db.ref('roast_game/votes').remove(),
                db.ref('roast_game/players').once('value')
            ]).then(([_, __, pSnap]) => {
                const players = Object.keys(pSnap.val() || {});
                
                // 過濾掉已經當過主角的人（如果全輪過一輪就重置名單）
                let candidates = players.filter(n => !usedTargetNames.includes(n));
                if (candidates.length === 0) {
                    usedTargetNames = [];
                    candidates = players;
                }

                // 隨機抽出一名玩家作為本題主角
                const chosenName = candidates[Math.floor(Math.random() * candidates.length)] || "某位神秘人";
                usedTargetNames.push(chosenName);

                // 將題目模板中的 {NAME} 替換成該玩家名字
                const rawTemplate = promptTemplates[roundIdx];
                const promptHTML = rawTemplate.replace(/{NAME}/g, `<span class="highlight-name">${escapeHTML(chosenName)}</span>`);

                db.ref('roast_game/state').set({
                    status: "writing",
                    round: roundIdx,
                    promptHTML: promptHTML
                });
            });
        }

        function hostMoveToVoting() {
            if (!isHost) return;
            db.ref('roast_game/state').update({ status: "voting" });
        }

        function hostRevealAndRank() {
            if (!isHost) return;

            // 結算分數並累加進 players 總分
            Promise.all([
                db.ref('roast_game/votes').once('value'),
                db.ref('roast_game/players').once('value')
            ]).then(([voteSnap, playerSnap]) => {
                const votes = voteSnap.val() || {};
                const players = playerSnap.val() || {};

                const voteCounts = {};
                Object.values(votes).forEach(target => {
                    voteCounts[target] = (voteCounts[target] || 0) + 1;
                });

                const updates = {};
                Object.keys(voteCounts).forEach(author => {
                    if (players[author]) {
                        const oldScore = players[author].score || 0;
                        updates[`roast_game/players/${author}/score`] = oldScore + (voteCounts[author] * 1000);
                    }
                });

                db.ref().update(updates).then(() => {
                    db.ref('roast_game/state').update({ status: "ranking" });
                });
            });
        }

        function hostNextRound() {
            if (!isHost) return;
            const nextIdx = currentRound + 1;
            if (nextIdx < promptTemplates.length) {
                hostStartNewRound(nextIdx);
            }
        }

        function hostResetGame() {
            if (!isHost) return;
            if (confirm("確定要結束並重置整輪遊戲嗎？除了你以外的所有玩家都會被踢回登入畫面！")) {
                usedTargetNames = [];
                Promise.all([
                    db.ref('roast_game/answers').remove(),
                    db.ref('roast_game/votes').remove(),
                    db.ref('roast_game/state').set({ status: "lobby", round: 0, promptHTML: "" })
                ]).then(() => {
                    db.ref('roast_game/players').remove().then(() => {
                        db.ref(`roast_game/players/${myName}`).set({ score: 0 });
                    });
                });
            }
        }

        // 防止玩家輸入 HTML 標籤破壞版面
        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, tag => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
            }[tag]));
        }
    </script>
</body>
</html>
